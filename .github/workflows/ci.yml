name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests y sintaxis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verificar sintaxis de los módulos
        run: find js scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check

      - name: Ejecutar tests
        run: npm test
